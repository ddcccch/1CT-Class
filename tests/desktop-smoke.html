<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>3CT AutoPanel 离线烟测台（fake ctAPI）</title>
<link rel="stylesheet" href="/desktop/panel.css" />
<style>
  body { margin: 0; background: #f4f5f7; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #harness { max-width: 980px; margin: 16px auto 40px; }
  #harness .hint { background: #fffbe6; border: 1px solid #ffe58f; padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #614700; margin-bottom: 12px; }
</style>
</head>
<body>
  <div id="harness">
    <div class="hint">
      离线烟测页：window.ctAPI 为 fake（不联网、无真实凭证），数据全部来自 <code>tests/desktop-smoke.html</code> 内的 fixture。
      账号/令牌均为假数据。页面由 Playwright(msedge) 驱动。
    </div>
    <div id="auto3ct-panel-host"></div>
  </div>

  <script src="/desktop/vendor/jsQR.js"></script>
  <script>
  // ───────────────────────── fake ctAPI（与 3CT preload 同形状） ─────────────────────────
  // 说明：只实现面板/引擎会调用的接口，返回值按 reverse/sources 实测形状构造。
  (function () {
    'use strict';

    // fake 账号/会话：全部是假值，任何情况下都不会发真实请求
    var FAKE_ACCOUNT = { id: 'acc-fake-1', phone: '13800000000', password: 'fake-pw', remark: '测试账号', updatedAt: 1 };
    var FAKE_EK_SESSION = {
      JSESSIONID: 'fake-jsessionid',
      access_token: 'fake-access-token',
      refresh_token: 'fake-refresh-token',
      user_info: { loginName: '20230001', userName: '测试用户' },
    };
    var FAKE_CAMPUS = { id: 'campus-1', label: '测试校区', mapName: 'fake-map.txt', schoolSiteIndex: 1 };
    var FAKE_CLUB_ITEM = {
      clubActivityId: 3001,
      activityName: '测试篮球俱乐部',
      optionStatus: '6',
      maxStudent: 30,
      startTime: '18:00',
      endTime: '19:00',
      nextMmdd: '2026-09-21',
      signInStudent: 3,
    };

    // 记录所有调用，供烟测断言“预览不产生任何写调用”
    var calls = [];
    var writeNames = /^(ek\.(applyActivity|signByQr|signInOutByOthers)|club\.(joinActivity|signInOrSignBack)|unirun\.(autoRun))$/;
    // 部分读接口加可控延迟，用于 busy 防重 / 停止中飞行结果落日志 等断言
    var delaysMs = {
      'club.myActivityList': 250,
      'ek.getActivitiesList': 250,
      'unirun.campusLocalList': 150,
      'ek.getActivityDetail': 80,
    };

    function wrap(group, name, fn) {
      return function (payload) {
        var fullName = group + '.' + name;
        var entry = { name: fullName, payload: payload, write: writeNames.test(fullName), at: Date.now() };
        calls.push(entry);
        var delay = delaysMs[fullName] || 0;
        return new Promise(function (resolve, reject) {
          setTimeout(function () {
            Promise.resolve()
              .then(function () {
                return fn(payload);
              })
              .then(resolve, reject);
          }, delay);
        });
      };
    }

    var table = {
      ek: {
        getActivitiesList: function () {
          return { List: { Items: [
            { Id: 'act-fake-1', ActivityId: 'act-fake-1', ActivityName: '测试校园歌手大赛', ActivityStatus: '0' },
            { Id: 'act-fake-2', ActivityId: 'act-fake-2', ActivityName: '无关活动', ActivityStatus: '0' },
          ] } };
        },
        getActivityDetail: function (payload) {
          return {
            ActivityInfo: {
              Id: payload.id,
              ActivityName: '测试校园歌手大赛',
              SignWay: '1',
              SignWayText: '扫码',
              IsNeedSignInText: '是',
              IsNeedSignOutText: '否',
              ActivityQDDate: '2026-09-21 18:00:00 至 2026-09-21 18:10:00',
              ActivityListInfo: { ActivitySignInfo: { SignD: '未签到', SignT: '未签退' } },
            },
            ApplyInfo: { Id: 'sign-fake-1', ActivityId: payload.id },
          };
        },
        activityBoundImages: function () {
          return { items: [] };
        },
        applyActivity: function () { return { errcode: 0 }; },
        signByQr: function () { return { errcode: 0 }; },
        signInOutByOthers: function () { return { errcode: 0 }; },
        getSignInDetail: function () { return { data: {} }; },
        checkLogin: function () { return { code: 0, data: { loginName: '20230001' } }; },
      },
      club: {
        myActivityList: function () { return { code: 10000, response: { list: [] } }; },
        activityList: function () { return { code: 10000, response: { list: [FAKE_CLUB_ITEM] } }; },
        currentSignTask: function () { return { code: 10000, response: null }; },
        joinActivity: function () { return { code: 10000 }; },
        signInOrSignBack: function () { return { code: 10000 }; },
      },
      unirun: {
        campusLocalList: function () { return [FAKE_CAMPUS]; },
        autoRun: function () { return { code: 10000, response: { recordId: 1 }, msg: 'ok' }; },
      },
    };

    var ctAPI = {};
    Object.keys(table).forEach(function (group) {
      ctAPI[group] = {};
      Object.keys(table[group]).forEach(function (name) {
        ctAPI[group][name] = wrap(group, name, table[group][name]);
      });
    });

    // 供 smoke 脚本读取的 fake 控制面
    ctAPI.__fake = {
      calls: calls,
      writeCount: function () { return calls.filter(function (c) { return c.write; }).length; },
      reset: function () { calls.length = 0; },
      seed: function () {
        // 幂等：已有数据时不覆盖，保证“重开恢复”测的是面板/引擎持久化而不是 fixture 重置
        if (!window.localStorage.getItem('ct_unirun_accounts_v1')) {
          window.localStorage.setItem('ct_unirun_accounts_v1', JSON.stringify({ selectedId: FAKE_ACCOUNT.id, items: [FAKE_ACCOUNT] }));
        }
        if (!window.localStorage.getItem('ct_ek_session_v1')) {
          window.localStorage.setItem('ct_ek_session_v1', JSON.stringify(FAKE_EK_SESSION));
        }
      },
      clearAll: function () { window.localStorage.clear(); },
      FAKE_ACCOUNT: FAKE_ACCOUNT,
      FAKE_EK_SESSION: FAKE_EK_SESSION,
    };

    window.ctAPI = ctAPI;

    // 固定测试时钟：2026-09-21 17:55 北京时间（二课签到窗口 18:00 开始）
    // 引擎支持 clock 注入，但面板使用 Date.now()；这里直接固定系统时间不可能，
    // 因此 fixture 的时间窗按“相对当前时间”生成，见下（保证烟测与运行日无关）。
    var now = Date.now();
    var bj = new Date(now + 8 * 3600 * 1000);
    function pad(n) { return String(n).padStart(2, '0'); }
    var today = bj.getUTCFullYear() + '-' + pad(bj.getUTCMonth() + 1) + '-' + pad(bj.getUTCDate());
    FAKE_CLUB_ITEM.nextMmdd = today;
    window.__SMOKE_TODAY__ = today;

    // 让详情时间窗覆盖“当前时刻 ±10 分钟”，便于窗口内 case 稳定触发
    var bjNowMs = now;
    function fmtBeijing(ms) {
      var d = new Date(ms + 8 * 3600 * 1000);
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' +
        pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
    }
    var windowStart = bjNowMs - 1 * 60 * 1000;
    var windowEnd = bjNowMs + 10 * 60 * 1000;
    window.__SMOKE_WINDOW__ = { start: fmtBeijing(windowStart), end: fmtBeijing(windowEnd) };

    // 覆盖 getActivityDetail 返回的时间窗（保持 fake 形状一致）
    ctAPI.ek.getActivityDetail = makeDetail;
    function makeDetail(payload) {
      calls.push({ name: 'ek.getActivityDetail', payload: payload, write: false, at: Date.now() });
      return Promise.resolve({
        ActivityInfo: {
          Id: payload.id,
          ActivityName: '测试校园歌手大赛',
          SignWay: '1',
          SignWayText: '扫码',
          IsNeedSignInText: '是',
          IsNeedSignOutText: '否',
          ActivityQDDate: window.__SMOKE_WINDOW__.start + ' 至 ' + window.__SMOKE_WINDOW__.end,
          ActivityListInfo: { ActivitySignInfo: { SignD: '未签到', SignT: '未签退' } },
        },
        ApplyInfo: { Id: 'sign-fake-1', ActivityId: payload.id },
      });
    }

    // seeded localStorage（面板/引擎读取；全部 fake）
    ctAPI.__fake.seed();
    // 默认干跑：首次加载才写 fixture 配置（重开恢复时保留用户/上次 UI 的改动）
    // 注意：**不预置模块 enabled**——模块开关必须由 smoke 通过 UI 点击（否则“全关只证明啥都没做”）。
    // unirun.runAt 取“当前北京时间”，保证任意运行时刻都落在有效窗口内（engine 严格校验 1..720 分钟）。
    var bjClock = new Date(Date.now() + 8 * 3600 * 1000);
    var runAtNow = pad(bjClock.getUTCHours()) + ':' + pad(bjClock.getUTCMinutes());
    window.__SMOKE_UNIRUN_RUN_AT__ = runAtNow;
    if (!window.localStorage.getItem('auto3ct:config')) {
      window.localStorage.setItem('auto3ct:config', JSON.stringify({
        dryRun: true,
        unirun: { runAt: runAtNow, windowMinutes: 60, runDistance: 3000, runTime: 30 },
        ek: { keywords: ['歌手'], apply: false, signIn: true, signOut: false, allowAll: false },
        club: { keywords: ['篮球'], join: false, signIn: false, signOut: false, allowAll: false },
      }));
    }

    window.__SMOKE_READY__ = false;
  })();
  </script>

  <script src="/desktop/automation.js"></script>
  <script src="/desktop/panel.js"></script>
  <script>
  // 面板加载完成后打标，供 Playwright 等待
  (function () {
    function mark() {
      window.__SMOKE_READY__ = true;
    }
    if (window.Auto3CTPanel) mark();
    else document.addEventListener('DOMContentLoaded', mark);
  })();
  </script>
</body>
</html>
